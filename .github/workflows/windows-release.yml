name: Build and publish Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folderbridge-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Read version
        shell: pwsh
        run: |
          $match = Select-String -Path "pyproject.toml" -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "Project version not found" }
          $version = $match.Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV
          $isPrerelease = $version -match '(?i)(?:a|b|rc|dev)\d*'
          "IS_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          choco install innosetup --no-progress -y

      - name: Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          FOLDERBRIDGE_DB: ${{ runner.temp }}\folderbridge-test.sqlite3
        run: python -m unittest discover -s tests -v

      - name: Ruff
        run: python -m ruff check src tests

      - name: Build Windows packages
        shell: pwsh
        run: ./build.ps1 -SkipChecks

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderBridge-${{ env.VERSION }}-windows-x64
          path: |
            releases/FolderBridge-${{ env.VERSION }}-setup.exe
            releases/FolderBridge-${{ env.VERSION }}-windows-x64.zip
            releases/FolderBridge-portable.zip
            releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $assets = @(
            "releases/FolderBridge-$env:VERSION-setup.exe",
            "releases/FolderBridge-$env:VERSION-windows-x64.zip",
            "releases/FolderBridge-portable.zip",
            "releases/SHA256SUMS.txt"
          )
          $notes = @"
          FolderBridge $env:VERSION — первый стабильный релиз.

          Код синхронизации соответствует проверенному пререлизу 0.1.0b2; функциональных изменений относительно него нет.
          - Исправлено создание заданий в Windows: значения направления и режима теперь надёжно преобразуются из Qt в типы движка перед сохранением в SQLite.
          - Добавлена собственная иконка FolderBridge для окна, системного трея, EXE и установщика.
          - Добавлен регрессионный UI-тест `QComboBox → SyncJob → SQLite` для обоих направлений и обоих режимов.
          - Несколько односторонних заданий ПК → Drive и Drive → ПК.
          - Копирование без удалений и восстановимое зеркало.
          - OAuth для Drive, программное ограничение корнем `FolderBridge`, SQLite-журнал, фоновые повторы, трей и автозапуск.
          - Встроенный менеджер версий с обновлением, переустановкой и откатом.
          - Установщик и portable ZIP; запуск из Git clone поддерживается отдельно.

          Сборка не подписана цифровой подписью, поэтому Windows SmartScreen может показать предупреждение.
          "@
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $assets --clobber --repo "${{ github.repository }}"
            gh release edit $tag --notes $notes --repo "${{ github.repository }}"
          } else {
            $releaseArgs = @(
              "release", "create", $tag
            ) + $assets + @(
              "--target", "${{ github.sha }}",
              "--title", "FolderBridge $env:VERSION",
              "--notes", $notes,
              "--repo", "${{ github.repository }}"
            )
            if ($env:IS_PRERELEASE -eq "true") {
              $releaseArgs += "--prerelease"
            }
            & gh @releaseArgs
          }
