[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folderbridge"
version = "0.1.0"
description = "Safe one-way folder synchronization between a PC and Google Drive"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-api-python-client>=2.180,<3",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "keyring>=25,<26",
  "packaging>=24,<26",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.15,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
folderbridge = "folderbridge.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
folderbridge = ["resources/*.ico", "resources/*.png", "resources/*.svg"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
